[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "api-bridge-mcp"
version = "1.0.0"
description = "A small example of wrapping a REST API as MCP tools"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Bryce Watson", email = "hi@brycewatson.com" }
]
license = { text = "MIT" }

# mcp 2.x renamed FastMCP to MCPServer, so stay on the 1.x line for now.
dependencies = [
    "mcp[cli]>=1.25,<2",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.30",
    "ruff>=0.6",
]

[project.scripts]
api-bridge = "api_bridge_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/api_bridge_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls the real JSONPlaceholder API over the network",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
# The tool signatures keep each parameter's description on one line.
ignore = ["E501"]
